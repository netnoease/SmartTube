name: Auto Sync SmartTube

on:
  schedule:
    # 设置为每周五（今天）晚上 23:00 (UTC时间)
    # 对应北京时间 (UTC+8)：每周六（明天）早上 07:00
    # 让你在周六早晨醒来时看到最新代码
    - cron: '0 23 * * 5'
  workflow_dispatch: # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    # 👇👇👇 关键修复：添加此段以获得推送权限 👇👇👇
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Git Config
        run: |
          git config user.name "SmartTube Sync Bot"
          git config user.email "bot@github.com"

      - name: Sync from Upstream
        run: |
          # 1. 添加原项目地址
          git remote add upstream https://github.com/yuliskov/SmartTube.git
          
          # 2. 获取上游仓库更新
          git fetch upstream
          
          # 3. 检出主分支 (该项目使用的是 master)
          git checkout master
          
          # 4. 合并上游 master 分支
          git merge upstream/master
          
          # 5. 推送到你的 Fork 仓库
          git push origin master
